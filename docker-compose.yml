services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:-Dev_Passw0rd!}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  api:
    build: .
    image: todoapp-api
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Configuration via environment variables: "__" maps to ":" (ConnectionStrings:Database).
      # Set SQL_SA_PASSWORD and JWT_SIGNING_KEY in your shell or a .env file. The fallbacks are for local tries only.
      ConnectionStrings__Database: "Server=sqlserver,1433;Database=TodoApp;User Id=sa;Password=${SQL_SA_PASSWORD:-Dev_Passw0rd!};TrustServerCertificate=True"
      Auth__Jwt__SigningKey: ${JWT_SIGNING_KEY:-local-docker-signing-key-change-me-0123456789}
    restart: unless-stopped

volumes:
  sqlserver-data:
